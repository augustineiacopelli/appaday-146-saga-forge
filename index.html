  function emptyBundle(title) {

      return '';

        z = t.lastIndexOf('\n', z);

  function collectRefs(node, out, top) {

  Kit.codex.derive.familyAffinity = function (rec, b) { return WSX.defaultAffinity(b, rec && rec.type, !!(rec && rec.absorbsOwnType)); };

  // ---------------------------------------------------------------- equipment: visual slot layout builder
  function slotLayoutOf(rec) {
    if (!U.isObj(rec.slotLayout)) rec.slotLayout = {};
    var L = rec.slotLayout;
    L.count = clampInt(L.count, 0, 8, 0);
    var seen = {}, out = [];
    (Array.isArray(L.links) ? L.links : []).forEach(function (p) {
      if (!Array.isArray(p) || p.length !== 2) return;
      var i = Math.round(Number(p[0])), j = Math.round(Number(p[1]));
      if (!isFinite(i) || !isFinite(j) || i === j) return;
      if (i > j) { var t = i; i = j; j = t; }
      var k = i + ':' + j;
      if (seen[k]) return;
      seen[k] = 1; out.push([i, j]);
    });
    L.links = out;
    return L;
  }
  // Slots sit in rows of four inside a 256 unit wide drawing, so the picture scales to any screen.
  function slotPos(i, count) {
    var r = Math.floor(i / 4), c = i % 4, inRow = Math.min(4, count - r * 4);
    return { x: (256 - inRow * 64) / 2 + 32 + c * 64, y: 46 + r * 72 };
  }
  function slotBuilder(box, rec, api) {
    var host = el('div', 'rl-slotb'); host.setAttribute('data-bpath', 'slotLayout');
    box.appendChild(host);
    var sel = -1, issues = issueBox('Equipment', rec, ['slotLayout']);
    function setCount(n) {
      var L = slotLayoutOf(rec), before = L.links.length;
      n = clampInt(n, 0, 8, 0);
      L.count = n;
      L.links = L.links.filter(function (p) { return p[0] < n && p[1] < n; });
      if (L.links.length < before) Kit.ui.toast('Removed ' + (before - L.links.length) + ' link' + (before - L.links.length === 1 ? '' : 's') + ' that pointed past the last slot.', 'warn');
      if (sel >= n) sel = -1;
      api.changed(false); paint();
    }
    function toggleLink(i, j) {
      var L = slotLayoutOf(rec);
      if (i > j) { var t = i; i = j; j = t; }
      var at = -1;
      L.links.forEach(function (p, k) { if (p[0] === i && p[1] === j) at = k; });
      if (at >= 0) L.links.splice(at, 1); else L.links.push([i, j]);
      L.links.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    }
    function pick(i) {
      if (sel < 0) { sel = i; paint(); return; }
      if (sel === i) { sel = -1; paint(); return; }
      toggleLink(sel, i); sel = -1; api.changed(false); paint();
    }
    function paint() {
      U.clear(host);
      var L = slotLayoutOf(rec);
      host.appendChild(el('h3', 'section-h', 'Slot layout'));
      host.appendChild(el('p', 'muted rl-note', 'Choose how many slots this piece has. Then tap one slot and a second slot to link or unlink them. Linked slots are joined by a bar.'));
      var ctl = el('div', 'rl-tools');
      var less = button('Fewer slots', 'down', 'btn-ghost', function () { setCount(L.count - 1); });
      var more = button('More slots', 'plus', 'btn-ghost', function () { setCount(L.count + 1); });
      less.disabled = L.count <= 0; more.disabled = L.count >= 8;
      ctl.appendChild(less);
      ctl.appendChild(el('span', 'rl-slotcount', '<strong>' + L.count + '</strong> slot' + (L.count === 1 ? '' : 's')));
      ctl.appendChild(more);
      var clr = button('Clear links', 'x', 'btn-ghost', function () { L.links = []; sel = -1; api.changed(false); paint(); });
      clr.disabled = !L.links.length;
      ctl.appendChild(clr);
      host.appendChild(ctl);
      if (L.count > 0) {
        var rows = Math.ceil(L.count / 4), H = rows * 72 + 22;
        var svg = svgEl('svg', { viewBox: '0 0 256 ' + H, role: 'group', 'aria-label': 'Slot layout with ' + L.count + ' slots and ' + L.links.length + ' links' }, 'rl-slotsvg');
        L.links.forEach(function (p) {
          if (p[0] >= L.count || p[1] >= L.count) return;

    for (var k = 2; k <= T; k++) (function (k) {

  // Total EXP for the final level is spread across the chapters by target minutes. Each chapter gets the highest level

    var total = 0;

    if (!(total > 0)) throw new Error('Give the chapters target minutes in the Charter first.');
    function need(L) { return WSX.evalRole('exp', { a: { level: L }, t: {}, power: 0 }); }

  // The cheapest kit at a gear tier: one weapon, one armor, one accessory. A piece that no open shop sells yet is priced at its base price.
  function gearCost(tier, ci, shops, eqps, idxOf) {

      if (!cands.length) return;

    var all = [];
    fr.forEach(function (r) { r.turns.forEach(function (t) { all.push(t); }); });
    var maxT = all.reduce(function (a, v) { return Math.max(a, v); }, 1);
    var width = Math.max(1, Math.ceil(maxT / 20)), nb = Math.ceil(maxT / width) + 1, bins = [], bl = [], i;
    for (i = 0; i < nb; i++) { bins.push(0); bl.push(width === 1 ? String(i) : (i * width) + '-' + (i * width + width - 1)); }
    all.forEach(function (t) { bins[Math.min(nb - 1, Math.floor(t / width))]++; });
    var o2 = baseOptions('Battles', 'Turns');
    o2.plugins.legend.display = false;
    drawChart(c2.holder, 'turns', {
      type: 'bar', data: { labels: bl, datasets: [{ label: 'Battles', data: bins, backgroundColor: fwd, borderWidth: 0 }] }, options: o2
    }, bl, [{ label: 'Battles', data: bins }], 'Histogram of battle lengths in turns for ' + fLabel + '.');

    // 4. damage spread by element
    var c4 = chartBox('Damage by element', 'simChart4', 'Total party damage dealt to foes, for ' + fLabel + '.');
    grid.appendChild(c4.panel);
    var elements = (rs(b).elements || []).filter(function (e) { return e && e.key; });
    var tot = {};
    fr.forEach(function (r) { Object.keys(r.damage).forEach(function (k) { tot[k] = (tot[k] || 0) + r.damage[k]; }); });
    var keys = elements.map(function (e) { return e.key; });
    Object.keys(tot).forEach(function (k) { if (k !== NONE && keys.indexOf(k) < 0) keys.push(k); });
    keys.push(NONE);
    var el4 = keys.map(function (k) { if (k === NONE) return 'Neutral'; var e = elements.filter(function (x) { return x.key === k; })[0]; return e ? (e.label || k) : k; });
    var dv = keys.map(function (k) { return Math.round(tot[k] || 0); });
    var dc = keys.map(function (k) { var e = elements.filter(function (x) { return x.key === k; })[0]; return e && /^#[0-9a-f]{6}$/i.test(e.color || '') ? e.color : (k === NONE ? '#8c8778' : accent); });
    var o4 = baseOptions(null, 'Damage');
    o4.indexAxis = 'y'; o4.plugins.legend.display = false;
    o4.scales.y = { ticks: { color: ink }, grid: { color: cssVar('--line', '#323a52') } };
    o4.scales.x.beginAtZero = true;
    drawChart(c4.holder, 'dmg', {
      type: 'bar', data: { labels: el4, datasets: [{ label: 'Damage', data: dv, backgroundColor: dc, borderWidth: 0 }] }, options: o4
    }, el4, [{ label: 'Damage', data: dv }], 'Bar chart of party damage by element for ' + fLabel + '.');
  }

  Kit.on('theme', function () { if (Kit.active() === 'sim' && document.getElementById('simRoot')) paintAll(); });
  Kit.on('load', function () { LAST = null; });
  Kit.mount('sim', { title: 'Simulator', icon: 'chart', canEnter: WSX.canEnter, render: WSX.render, onLeave: function () { destroyCharts(); V.host = null; return true; } });
})();
// === WS:SIM END ===
// === APP:BOOT BEGIN ===
(function () {
  'use strict';
  function wire(id, icon, label, fn) {
    var b = document.getElementById(id);
    if (!b) return;
    if (icon) b.innerHTML = Kit.icon(icon) + (label ? '<span class="lbl">' + label + '</span>' : '');
    b.addEventListener('click', fn);
  }
  Kit.theme.apply();
  try {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () { if (Kit.theme.get() === 'system') Kit.theme.apply(); });
  } catch (e) {}
  wire('btnSettings', 'gear', null, function () { Kit.settings.open(); });
  document.getElementById('btnTheme').addEventListener('click', Kit.theme.toggle);
  wire('btnTitle', null, null, Kit.renameProject);
  wire('btnValidation', null, null, Kit.openValidation);
  wire('btnSave', 'save', 'Save', function () { if (Kit.bundle.save()) Kit.ui.toast('Draft saved in this browser.', 'ok'); });
  wire('btnSlots', 'slots', 'Slots', Kit.openSlots);
  wire('btnImport', 'import', 'Import', function () { var f = document.getElementById('fileImport'); f.value = ''; f.click(); });
  wire('btnExport', 'export', 'Export', Kit.openExport);
  // First run welcome card (Pass 6). It explains the three stages and stays out of the way once dismissed.
  function paintWelcome() {
    var w = document.getElementById('welcome');
    if (!w) return;
    U_clear(w);
    w.innerHTML = '<h2>Welcome to Saga Forge</h2>' +
      '<p>Saga Forge starts empty. You define everything yourself in three stages, then test the battles you made.</p>' +
      '<ol class="welcome-stages">' +
      '<li><strong>Charter</strong><span>Write your saga: premise, party, chapters, and the ruleset. Lock it when it has no errors.</span></li>' +
      '<li><strong>Codex</strong><span>Generate the record types that your locked ruleset calls for, such as materia or classes.</span></li>' +
      '<li><strong>Rules</strong><span>Author characters, abilities, enemies, and troops. Fight them in the Arena and balance them in the Simulator.</span></li>' +
      '</ol>' +
      '<div class="btn-row"><button class="btn btn-primary" id="welcomeGo" type="button">Start with the Charter</button><button class="btn btn-ghost" id="welcomeHide" type="button">Dismiss</button></div>';
    document.getElementById('welcomeGo').addEventListener('click', function () { hideWelcome(); Kit.go('charter'); });
    document.getElementById('welcomeHide').addEventListener('click', hideWelcome);
  }
  function U_clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function hideWelcome() { var w = document.getElementById('welcome'); if (w) w.hidden = true; Kit.uiState.set({ welcomeSeen: true }); }
  function showWelcome() { var w = document.getElementById('welcome'); if (!w) return; paintWelcome(); w.hidden = false; try { w.scrollIntoView({ block: 'start' }); } catch (e) {} }
  document.getElementById('btnWelcome').addEventListener('click', showWelcome);
  Kit.welcome = { show: showWelcome, hide: hideWelcome };
  var booted = false;
  Kit.on('change', function (e) {
    var w = document.getElementById('welcome');
    if (booted && w && !w.hidden && String((e && e.reason) || 'edit') !== 'restore') hideWelcome();
  });
  document.getElementById('fileImport').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    Kit.importPicked(f);
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      if (Kit.bundle.save()) Kit.ui.toast('Draft saved in this browser.', 'ok');
    } else if (e.key === 'Escape' && Kit.ui.overlayCount() && !Kit.ui.busy.active()) {
      e.preventDefault();
      Kit.ui.closeTop();
    }
  });
  var suspended = Kit.bundle.suspend.load();
  if (!Kit.uiState.get().welcomeSeen) { paintWelcome(); document.getElementById('welcome').hidden = false; }
  var b = Kit.bundle.restoreDraft() || Kit.bundle.create('Untitled Saga');
  var want = (suspended && suspended.bundleId === b.kit.bundleId && suspended.workspace) || Kit.uiState.get().tab || 'charter';
  if (!Kit.go(want, { silent: true })) Kit.go('charter', { silent: true });
  booted = true;
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') Kit.bundle.suspend.save(); });
  window.addEventListener('pagehide', function () { Kit.bundle.suspend.save(); });
})();
// === APP:BOOT END ===
</script>
</body>
